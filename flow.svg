<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5a6b7b"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e78">Inflow Reclassification &amp; Autopost Generator - how a line is processed</text>

  <rect x="20" y="70" width="150" height="90" rx="10" fill="#e8f1fa" stroke="#1f4e78"/>
  <text x="95" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e78">1. Bank statement</text>
  <text x="95" y="127" text-anchor="middle" font-size="12" fill="#333">paste into Bank tab</text>
  <text x="95" y="145" text-anchor="middle" font-size="12" fill="#333">(credits only are used)</text>

  <rect x="215" y="55" width="215" height="120" rx="10" fill="#fff4d6" stroke="#b38600"/>
  <text x="322" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">2. Find the ledger</text>
  <text x="322" y="106" text-anchor="middle" font-size="12" fill="#333">a) policy number in remark</text>
  <text x="322" y="124" text-anchor="middle" font-size="12" fill="#333">b) holder name (whole name)</text>
  <text x="322" y="142" text-anchor="middle" font-size="12" fill="#333">c) product name (longest wins)</text>
  <text x="322" y="162" text-anchor="middle" font-size="12" fill="#333">d) else REVIEW</text>

  <rect x="475" y="70" width="190" height="90" rx="10" fill="#fde9e7" stroke="#b03a2e"/>
  <text x="570" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a2e">3. Safeguards</text>
  <text x="570" y="118" text-anchor="middle" font-size="12" fill="#333">policy vs remark conflict held</text>
  <text x="570" y="136" text-anchor="middle" font-size="12" fill="#333">ambiguous product held</text>
  <text x="570" y="154" text-anchor="middle" font-size="12" fill="#333">name matches flagged "verify"</text>

  <rect x="710" y="55" width="170" height="120" rx="10" fill="#e6f4ea" stroke="#2e7d32"/>
  <text x="795" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">4. Output</text>
  <text x="795" y="106" text-anchor="middle" font-size="12" fill="#333">Master + Details</text>
  <text x="795" y="124" text-anchor="middle" font-size="12" fill="#333">(upload file)</text>
  <text x="795" y="146" text-anchor="middle" font-size="12" fill="#333">Autocredit (clean list)</text>

  <line x1="170" y1="115" x2="213" y2="115" stroke="#5a6b7b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="430" y1="115" x2="473" y2="115" stroke="#5a6b7b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="665" y1="115" x2="708" y2="115" stroke="#5a6b7b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="215" y="225" width="665" height="75" rx="10" fill="#f2f2f2" stroke="#7f7f7f"/>
  <text x="547" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">5. Checks tab - the file is only "ready" when all of these agree</text>
  <text x="547" y="275" text-anchor="middle" font-size="12" fill="#333">bank credits = posted + review + skipped   |   debits = credits   |   Autocredit rows = Items rows</text>
  <line x1="795" y1="175" x2="795" y2="223" stroke="#5a6b7b" stroke-width="2" marker-end="url(#a)"/>
</svg>
